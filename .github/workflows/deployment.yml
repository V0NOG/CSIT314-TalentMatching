name: Deployment

on:
  push:
    branches:
      - phase-1-stable
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deployment
  cancel-in-progress: true
  
jobs:
  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dep
        run: npm install

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build
        env:
          CONFIGURED_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          if [ -z "$CONFIGURED_API_URL" ]; then
            echo "Missing GitHub repository variable: VITE_API_URL"
            echo "Set VITE_API_URL to your Render backend URL."
            exit 1
          fi

          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          OWNER_NAME="${GITHUB_REPOSITORY_OWNER}"

          if [ "$REPO_NAME" = "$OWNER_NAME.github.io" ]; then
            BASE_PATH="/"
          else
            BASE_PATH="/$REPO_NAME/"
          fi

          export VITE_API_URL="$CONFIGURED_API_URL"

          echo "Building frontend with base path: $BASE_PATH"
          echo "Frontend API target: $VITE_API_URL"

          npm run build -- --base="$BASE_PATH"

      - name: Add SPA fallback for GitHub Pages
        run: cp dist/index.html dist/404.html

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  deploy-backend:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest

    environment:
      name: production
      url: ${{ vars.RENDER_SERVICE_URL }}

    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Missing GitHub secret: RENDER_DEPLOY_HOOK_URL"
            exit 1
          fi

          curl --fail --show-error --silent --location --request POST "$RENDER_DEPLOY_HOOK_URL"

          echo "Render deployment triggered."

      - name: Verify Render backend health
        env:
          RENDER_SERVICE_URL: ${{ vars.RENDER_SERVICE_URL }}
        run: |
          if [ -z "$RENDER_SERVICE_URL" ]; then
            echo "Missing GitHub repository variable: RENDER_SERVICE_URL"
            exit 1
          fi

          HEALTH_URL="${RENDER_SERVICE_URL%/}/"

          echo "Checking backend at $HEALTH_URL"

          for attempt in {1..60}; do
            if curl -fsS "$HEALTH_URL" > /tmp/render-health.json; then
              echo "Render backend is healthy"
              cat /tmp/render-health.json
              exit 0
            fi

            echo "Backend not ready yet. Attempt $attempt/60"
            sleep 5
          done

          echo "Render backend did not become healthy"
          exit 1

  deploy-frontend:
    name: Deploy Frontend to GitHub Pages
    runs-on: ubuntu-latest

    needs:
      - build-frontend
      - deploy-backend

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend-dist

      - name: Deploy GitHub Pages site
        id: deployment
        uses: actions/deploy-pages@v4
